<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
<title id="title">Get involved</title><desc id="desc">Ways students, developers, and researchers can participate.</desc>
<rect width="720" height="690" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(24 24)"><rect width="672" height="190" rx="12" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="58" cy="60" r="30" fill="#EAF3FF"/><path d="M31 51l27-14 27 14-27 14-27-14Zm10 8v18c12 9 22 9 34 0V59" fill="none" stroke="#0969DA" stroke-width="3"/><text x="105" y="51" fill="#00274C" font-size="22" font-weight="700">STUDENTS</text><text x="105" y="83" fill="#57606A" font-size="17">Learn from real research software. Contribute code,</text><text x="105" y="108" fill="#57606A" font-size="17">documentation, testing, design, examples, or ideas.</text><text x="105" y="148" fill="#0969DA" font-size="15" font-weight="700">BUILD EXPERIENCE WITH REAL PROJECTS →</text></g>
  <g transform="translate(24 250)"><rect width="672" height="190" rx="12" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="58" cy="60" r="30" fill="#EAF8EE"/><path d="M50 43L35 60l15 17M66 43l15 17-15 17M62 37L54 83" fill="none" stroke="#1A7F37" stroke-width="3"/><text x="105" y="51" fill="#00274C" font-size="22" font-weight="700">DEVELOPERS</text><text x="105" y="83" fill="#57606A" font-size="17">Fork something useful. Improve it. Report bugs and</text><text x="105" y="108" fill="#57606A" font-size="17">share reusable solutions with research teams.</text><text x="105" y="148" fill="#1A7F37" font-size="15" font-weight="700">CONTRIBUTE &amp; COLLABORATE →</text></g>
  <g transform="translate(24 476)"><rect width="672" height="190" rx="12" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="58" cy="60" r="30" fill="#F3EAFE"/><path d="M52 35h13l-3 11v25c0 8-7 15-15 15s-15-7-15-15h30M43 47h19M38 72h24" fill="none" stroke="#6639BA" stroke-width="3"/><text x="105" y="51" fill="#00274C" font-size="22" font-weight="700">RESEARCHERS</text><text x="105" y="83" fill="#57606A" font-size="17">Use our tools, adapt them to your studies, tell us</text><text x="105" y="108" fill="#57606A" font-size="17">what is missing, or collaborate on new solutions.</text><text x="105" y="148" fill="#6639BA" font-size="15" font-weight="700">USE, ADAPT &amp; PARTNER →</text></g>
</g>
</svg>