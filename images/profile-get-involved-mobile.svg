<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">Get involved</title>
<desc id="desc">Ways for students, developers, and researchers to engage with the open source projects.</desc>
<defs><style>.card{fill:#F8FAFC;stroke:#D8E2EE;stroke-width:2}.title{font:700 22px Arial, Helvetica, sans-serif}.desc{font:400 16px Arial, Helvetica, sans-serif;fill:#33475B}</style></defs>
<rect x="28" y="24" rx="18" ry="18" width="664" height="146" class="card"/>
<circle cx="90" cy="76" r="28" fill="#E8F1FF" stroke="#2A6FD6" stroke-width="2"/><path d="M71 78l19-10 19 10M77 75v9c0 3 8 8 13 8s13-5 13-8v-9M67 81v14" fill="none" stroke="#2A6FD6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67" cy="98" r="2.5" fill="#2A6FD6"/>
<text x="138" y="74" fill="#0D3B75" class="title">STUDENTS</text><text x="138" y="104" class="desc">Build experience with real projects. Learn from production research tools.</text><text x="138" y="128" class="desc">Contribute code, docs, tests, design ideas, or example workflows.</text>

<rect x="28" y="198" rx="18" ry="18" width="664" height="146" class="card"/>
<circle cx="90" cy="250" r="28" fill="#EAF7ED" stroke="#2F8F46" stroke-width="2"/><path d="M76 234l-12 16 12 16M104 234l12 16-12 16M87 268l6-36" fill="none" stroke="#2F8F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="138" y="248" fill="#1B6D34" class="title">DEVELOPERS</text><text x="138" y="278" class="desc">Fork something useful. Improve it. Report bugs and contribute fixes.</text><text x="138" y="302" class="desc">Share solutions that can help research teams well beyond your own.</text>

<rect x="28" y="372" rx="18" ry="18" width="664" height="146" class="card"/>
<circle cx="90" cy="424" r="28" fill="#F3ECFF" stroke="#7A3EC8" stroke-width="2"/><path d="M78 406h20a4 4 0 0 1 4 4v28l-6-4-6 4-6-4-6 4v-28a4 4 0 0 1 4-4z" fill="none" stroke="#7A3EC8" stroke-width="2.4" stroke-linejoin="round"/><path d="M83 414h14M83 420h14M83 426h9" fill="none" stroke="#7A3EC8" stroke-width="2.2" stroke-linecap="round"/>
<text x="138" y="422" fill="#6C34AF" class="title">RESEARCHERS</text><text x="138" y="452" class="desc">Use our tools in your work. Adapt them to your studies.</text><text x="138" y="476" class="desc">Tell us what is missing, or collaborate with us on new solutions.</text>
</svg>
