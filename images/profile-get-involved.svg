<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 252" role="img" aria-labelledby="title desc"><title id="title">Get involved</title><desc id="desc">Ways for students, developers, and researchers to engage with the open source projects.</desc><!-- UI icons: Bootstrap Icons, MIT License --><defs><style>.card{fill:#F8FAFC;stroke:#D8E2EE;stroke-width:2}.title{font:700 20px Arial,Helvetica,sans-serif}.desc{font:400 15px Arial,Helvetica,sans-serif;fill:#33475B}</style></defs><rect x="24" y="18" rx="15" width="368" height="200" class="card"/><circle cx="78" cy="66" r="27" fill="#E8F1FF" stroke="#2A6FD6" stroke-width="2"/><g transform="translate(60 48) scale(2.25)" fill="#2A6FD6"><path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917zM8 8.46 1.758 5.965 8 3.052l6.242 2.913z"/><path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466zm-.068 1.873.22-.748 3.496 1.311a.5.5 0 0 0 .352 0l3.496-1.311.22.748L8 12.46z"/></g><text x="120" y="72" fill="#0D3B75" class="title">STUDENTS</text><text x="48" y="116" class="desc">Learn from real research software.</text><text x="48" y="139" class="desc">Contribute code, documentation, testing,</text><text x="48" y="162" class="desc">design, examples, or new ideas.</text><rect x="416" y="18" rx="15" width="368" height="200" class="card"/><circle cx="470" cy="66" r="27" fill="#EAF7ED" stroke="#2F8F46" stroke-width="2"/><g transform="translate(452 48) scale(2.25)" fill="#2F8F46"><path d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0"/></g><text x="512" y="72" fill="#1B6D34" class="title">DEVELOPERS</text><text x="440" y="116" class="desc">Fork something useful. Improve it.</text><text x="440" y="139" class="desc">Report bugs and contribute reusable fixes</text><text x="440" y="162" class="desc">that can help other research teams.</text><rect x="808" y="18" rx="15" width="368" height="200" class="card"/><circle cx="862" cy="66" r="27" fill="#F3ECFF" stroke="#7A3EC8" stroke-width="2"/><g transform="translate(844 48) scale(2.25)" fill="#7A3EC8"><path d="M5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5"/><path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/><path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/></g><text x="904" y="72" fill="#6C34AF" class="title">RESEARCHERS</text><text x="832" y="116" class="desc">Use our tools and adapt them to your studies.</text><text x="832" y="139" class="desc">Tell us what is missing, or collaborate with</text><text x="832" y="162" class="desc">us on new solutions.</text></svg>