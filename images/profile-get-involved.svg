<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">Get involved</title>
<desc id="desc">Ways for students, developers, and researchers to engage with the open source projects.</desc>
<defs><style>.card{fill:#F8FAFC;stroke:#D8E2EE;stroke-width:2}.title{font:700 22px Arial, Helvetica, sans-serif}.desc{font:400 15px Arial, Helvetica, sans-serif;fill:#33475B}</style></defs>
<rect x="24" y="24" rx="16" ry="16" width="368" height="218" class="card"/>
<circle cx="80" cy="74" r="28" fill="#E8F1FF" stroke="#2A6FD6" stroke-width="2"/>
<path d="M61 76l19-10 19 10M67 73v9c0 3 8 8 13 8s13-5 13-8v-9M57 79v14" fill="none" stroke="#2A6FD6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="57" cy="96" r="2.5" fill="#2A6FD6"/>
<text x="124" y="72" fill="#0D3B75" class="title">STUDENTS</text>
<text x="52" y="122" class="desc">Build experience with real projects.</text>
<text x="52" y="145" class="desc">Learn from production research tools.</text>
<text x="52" y="168" class="desc">Contribute code, documentation, tests,</text>
<text x="52" y="191" class="desc">design ideas, or example workflows.</text>

<rect x="416" y="24" rx="16" ry="16" width="368" height="218" class="card"/>
<circle cx="472" cy="74" r="28" fill="#EAF7ED" stroke="#2F8F46" stroke-width="2"/>
<path d="M458 58l-12 16 12 16M486 58l12 16-12 16M469 92l6-36" fill="none" stroke="#2F8F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="72" fill="#1B6D34" class="title">DEVELOPERS</text>
<text x="444" y="122" class="desc">Fork something useful. Improve it.</text>
<text x="444" y="145" class="desc">Report bugs and contribute fixes.</text>
<text x="444" y="168" class="desc">Share solutions that can help research</text>
<text x="444" y="191" class="desc">teams well beyond your own.</text>

<rect x="808" y="24" rx="16" ry="16" width="368" height="218" class="card"/>
<circle cx="864" cy="74" r="28" fill="#F3ECFF" stroke="#7A3EC8" stroke-width="2"/>
<path d="M852 56h20a4 4 0 0 1 4 4v28l-6-4-6 4-6-4-6 4V60a4 4 0 0 1 4-4z" fill="none" stroke="#7A3EC8" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M857 64h14M857 70h14M857 76h9" fill="none" stroke="#7A3EC8" stroke-width="2.2" stroke-linecap="round"/>
<text x="908" y="72" fill="#6C34AF" class="title">RESEARCHERS</text>
<text x="836" y="122" class="desc">Use our tools in your work.</text>
<text x="836" y="145" class="desc">Adapt them to your studies.</text>
<text x="836" y="168" class="desc">Tell us what is missing, or collaborate</text>
<text x="836" y="191" class="desc">with us on new solutions.</text>
</svg>
