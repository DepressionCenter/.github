<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">What we build</title>
<desc id="desc">Research software, data and visualization, automation, and mobile technologies.</desc>
<defs>
  <style>
    .card{fill:#F8FAFC;stroke:#D8E2EE;stroke-width:2}
    .title{font:700 20px Arial, Helvetica, sans-serif}
    .desc{font:400 14px Arial, Helvetica, sans-serif; fill:#33475B}
  </style>
</defs>
<rect x="24" y="22" rx="16" ry="16" width="276" height="186" class="card"/>
