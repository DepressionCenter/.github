<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Accelerating innovations through code</title>
<desc id="desc">Eisenberg Family Depression Center open source research and automation code at the University of Michigan, with a glowing brain illustration on the right.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00162F"/><stop offset="0.55" stop-color="#00274C"/><stop offset="1" stop-color="#0A3D73"/></linearGradient>
<radialGradient id="halo" cx="83%" cy="43%" r="42%"><stop offset="0" stop-color="#2CA7F8" stop-opacity=".35"/><stop offset="1" stop-color="#2CA7F8" stop-opacity="0"/></radialGradient>
<filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
