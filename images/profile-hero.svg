<g transform="translate(62 44)">
<rect x="0" y="6" width="48" height="48" rx="6" fill="#FFCB05"/><text x="13" y="41" fill="#00274C" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="32" font-weight="900">M</text>
<text x="64" y="25" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">EISENBERG FAMILY</text>
<text x="64" y="48" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DEPRESSION CENTER</text>
<text x="64" y="67" fill="#C8D7E6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">UNIVERSITY OF MICHIGAN</text>
<text x="0" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Accelerating <tspan fill="#FFCB05">innovations</tspan> through code</text>
<text x="0" y="164" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">to improve mental health outcomes</text>
<text x="0" y="200" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">across our communities.</text>
<text x="0" y="246" fill="#F0F4F8" font-family="Arial, Helvetica, sans-serif" font-size="14">We build and share open source software, automations, analytical workflows,</text>
<text x="0" y="268" fill="#F0F4F8" font-family="Arial, Helvetica, sans-serif" font-size="14">data tools, and mobile technology resources that help research teams move</text>
<text x="0" y="290" fill="#F0F4F8" font-family="Arial, Helvetica, sans-serif" font-size="14">faster and solve problems—without reinventing the wheel.</text>
</g>
