<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Code that accelerates research breakthroughs</title>
  <desc id="desc">Eisenberg Family Depression Center open source research and automation code at the University of Michigan, with a glowing neural network brain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001426"/>
      <stop offset="0.52" stop-color="#00274C"/>
      <stop offset="1" stop-color="#003B70"/>
