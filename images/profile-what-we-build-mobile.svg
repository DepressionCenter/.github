<title id="title">What we build</title><desc id="desc">Research software, data and visualization, automation, and mobile technologies.</desc>
<rect width="720" height="590" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(24 24)"><rect width="672" height="120" rx="12" fill="#fff" stroke="#D8DEE4"/><circle cx="52" cy="60" r="28" fill="#EAF3FF" stroke="#2F81F7"/><path d="M42 42h20M48 42v14L36 76c-2 4 1 8 6 8h20c5 0 8-4 6-8L56 56V42" fill="none" stroke="#0969DA" stroke-width="3"/><text x="95" y="48" fill="#00274C" font-size="20" font-weight="700">RESEARCH SOFTWARE</text><text x="95" y="76" fill="#57606A" font-size="16">Tools and reusable workflows that accelerate research</text><text x="95" y="98" fill="#57606A" font-size="16">and support reproducibility.</text></g>
  <g transform="translate(24 164)"><rect width="672" height="120" rx="12" fill="#fff" stroke="#D8DEE4"/><circle cx="52" cy="60" r="28" fill="#EAF8EE" stroke="#2DA44E"/><path d="M39 78V66h8v12M51 78V56h8v22M63 78V47h8v31" fill="none" stroke="#1A7F37" stroke-width="3"/><path d="M37 54l12-10 10 5 14-14" fill="none" stroke="#1A7F37" stroke-width="3"/><text x="95" y="48" fill="#00274C" font-size="20" font-weight="700">DATA &amp; VISUALIZATION</text><text x="95" y="76" fill="#57606A" font-size="16">Cleaning, analytics, dashboards, visualization, and</text><text x="95" y="98" fill="#57606A" font-size="16">reporting for research teams.</text></g>
  <g transform="translate(24 304)"><rect width="672" height="120" rx="12" fill="#fff" stroke="#D8DEE4"/><circle cx="52" cy="60" r="28" fill="#FFF4D6" stroke="#D4A000"/><g transform="translate(52 60)" fill="none" stroke="#B58100" stroke-width="3"><circle r="10"/><path d="M0-23v7M0 16v7M-23 0h7M16 0h7M-16-16l5 5M11 11l5 5M16-16l-5 5M-11 11l-5 5"/></g><text x="95" y="48" fill="#00274C" font-size="20" font-weight="700">AUTOMATION</text><text x="95" y="76" fill="#57606A" font-size="16">Reduce repetitive technical work and remove barriers</text><text x="95" y="98" fill="#57606A" font-size="16">so research teams can move faster.</text></g>
  <g transform="translate(24 444)"><rect width="672" height="120" rx="12" fill="#fff" stroke="#D8DEE4"/><circle cx="52" cy="60" r="28" fill="#F3EAFE" stroke="#8250DF"/><rect x="41" y="37" width="22" height="46" rx="4" fill="none" stroke="#6639BA" stroke-width="3"/><circle cx="52" cy="77" r="1.8" fill="#6639BA"/><text x="95" y="48" fill="#00274C" font-size="20" font-weight="700">MOBILE TECHNOLOGIES</text><text x="95" y="76" fill="#57606A" font-size="16">Wearables, sensors, apps, mobile data, and research</text><text x="95" y="98" fill="#57606A" font-size="16">technology resources.</text></g>
